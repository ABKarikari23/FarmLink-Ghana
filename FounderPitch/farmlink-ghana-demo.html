<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmLink Ghana: working prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5EE; --surface:#FFFFFF; --surface2:#E9EEE3; --ink:#1B2620; --muted:#55645A; --line:#D3DCCB;
  --canopy:#14382A; --btn:#14382A; --gold:#E3A72F; --gold-soft:#FBF0D3; --clay:#B8502F; --ok:#2E7D4F; --focus:#1D6FD1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1813; --surface:#16231C; --surface2:#1D2D24; --ink:#E6EEE5; --muted:#A3B3A7; --line:#2B3E33;
    --canopy:#0A2017; --btn:#2F7A55; --gold-soft:#3A2F12; --clay:#E07A57; --ok:#5CC187; --focus:#7AB2F5;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1813; --surface:#16231C; --surface2:#1D2D24; --ink:#E6EEE5; --muted:#A3B3A7; --line:#2B3E33;
  --canopy:#0A2017; --btn:#2F7A55; --gold-soft:#3A2F12; --clay:#E07A57; --ok:#5CC187; --focus:#7AB2F5;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
small{font-size:13px;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:21px}
.navtabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px}
.navtabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer;min-height:40px}
.navtabs button[aria-selected="true"]{background:var(--btn);color:#fff}
.banner{background:var(--gold-soft);font-size:14px;padding:8px 16px;text-align:center}

/* demo layout */
.demo{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto;padding:20px 16px 48px}
@media (max-width:900px){.demo{grid-template-columns:minmax(0,1fr)}}

/* phone */
.phone{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:min(780px,calc(100dvh - 110px));min-height:640px;box-shadow:0 24px 50px -24px rgba(10,32,23,.45)}
@media (max-width:900px){.phone{height:auto;min-height:620px}}
.app-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.who b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;display:block}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border-radius:14px;padding:4px;margin-top:12px}
.rtab{position:relative;border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:600;cursor:pointer;min-height:42px}
.rtab[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dot{position:absolute;top:3px;right:6px;background:var(--clay);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.app-body{flex:1;overflow:auto;padding:14px 14px 22px}
@media (max-width:900px){.app-body{overflow:visible}}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button,.chip-f{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"],.chip-f[aria-pressed="true"]{background:var(--btn);color:#fff;border-color:var(--btn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip-f{white-space:nowrap}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.item:hover:not(:disabled){border-color:var(--btn)}
.item:disabled{opacity:.5;cursor:not-allowed}
.ico{flex:none;width:46px;height:46px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;font-size:26px}
.ico.sm{width:40px;height:40px;font-size:22px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.meta b{font-size:16px}
.meta em{font-style:normal;font-size:14px;color:var(--muted)}
.ver{color:var(--ok);font-weight:600}
.price{text-align:right;font-weight:700;font-size:17px;display:flex;flex-direction:column}
.price small{font-weight:500}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:16px}

/* orders */
.ord{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:var(--surface)}
.ord>header{display:flex;gap:10px;align-items:flex-start}
.ord>header>div{flex:1;min-width:0}
.ord>header b{display:block}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--surface2)}
.s-escrow{background:var(--gold-soft)}
.s-arrived{background:var(--gold);color:#241a05}
.s-released{background:var(--ok);color:#fff}
.track{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.rail{position:relative;flex:1;height:8px;border-radius:4px;background:var(--surface2)}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--btn);transition:width .4s linear}
.rail b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;transition:left .4s linear}
.confirm{margin-top:12px;display:grid;gap:10px}
.sms{background:var(--surface2);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px}
.sms small{display:block}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;width:100%}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:46px;width:100%}
.btn.primary{background:var(--btn);color:#fff}
.btn.gold{background:var(--gold);color:#241a05}
.btn.ghost{background:var(--surface2)}
.btn.slim{width:auto;padding:8px 14px;min-height:40px}
.rows{display:grid;gap:6px;margin-top:10px;font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:16px}
.wallet{background:var(--canopy);color:#F1F5EC;border-radius:18px;padding:16px;margin-bottom:14px}
.wallet small{color:#B9C9BF}
.wallet .big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:32px;font-weight:800;line-height:1.1}
.sect{margin:18px 0 8px;font-size:17px}
.form{display:grid;gap:10px;border:1px dashed var(--line);border-radius:16px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* sheet */
.sheetwrap{position:absolute;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;z-index:5}
@media (max-width:900px){.sheetwrap{position:fixed}}
.sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{font-size:22px;margin-bottom:4px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:700;cursor:pointer}
.stepper output{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:800;text-align:center;flex:1}
.nets{display:grid;gap:8px;margin:10px 0}
.nets button{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:600;cursor:pointer;min-height:48px}
.nets button[aria-pressed="true"]{border-color:var(--btn);background:var(--surface2)}
.ussd{background:#1b1f1c;color:#E9F2EA;border-radius:16px;padding:16px;font-size:15px;margin:10px 0;display:grid;gap:10px}
.ussd small{color:#9db0a3}
.ussd input{background:#2a302c;color:#fff;border-color:#3b443e;text-align:center;letter-spacing:.5em;font-size:20px}

/* panel */
.panel{background:var(--canopy);color:#F1F5EC;border-radius:24px;padding:24px;align-self:start;position:sticky;top:16px;display:grid;gap:22px}
@media (max-width:900px){.panel{position:static}}
.panel h2{font-size:26px}
.panel small{color:#B9C9BF}
.mbar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin:12px 0}
.mbar i{display:block;transition:flex .5s}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span.sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px}
.stats b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;line-height:1.15}
ol.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
ol.steps li{display:flex;gap:12px;align-items:center;opacity:.55}
ol.steps li .c{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:13px;flex:none}
ol.steps li.done{opacity:1}
ol.steps li.done .c{background:#6FCB98;border-color:#6FCB98;color:#0A2017;font-weight:800}
ol.steps li.now{opacity:1;font-weight:700}
ol.steps li.now .c{border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,167,47,.3)}
.hint{background:rgba(227,167,47,.16);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin-top:14px}
.hint .btn{background:var(--gold);color:#241a05;width:auto;justify-self:start;padding:9px 14px;min-height:40px}
.log{display:grid;gap:8px;font-size:14px;margin-top:10px}
.log div{display:flex;gap:10px}
.log time{color:#B9C9BF;flex:none;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:#F1F5EC;text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:600;justify-self:start}

.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lang{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:999px;flex:none}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--btn);color:#fff}
.qrbox{background:#fff;padding:14px;border-radius:14px;width:min(230px,72%);margin:0 auto;display:grid;place-items:center;color:#000;font-size:28px}
.qrbox svg{width:100%;height:auto;display:block}
.link2{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;font-weight:600;min-height:40px;justify-self:start}
.s-disputed{background:var(--clay);color:#fff}
.case{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;display:grid;gap:8px;margin-top:10px}
.case .acts{display:flex;gap:8px;flex-wrap:wrap}
.case .btn{width:auto;background:var(--gold);color:#241a05;padding:8px 12px;min-height:40px;font-size:14px}
.contact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.contact a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.who-line{margin-top:16px;color:var(--muted);font-size:15px}
.pilot{font-size:13px;color:var(--ink);background:var(--gold-soft);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.disc{background:var(--gold-soft);border-radius:14px;padding:12px 16px;font-size:15px;margin-top:20px}
ol.flow{margin:0;padding-left:22px;display:grid;gap:8px}
.cols2{columns:2;column-gap:28px;margin:0;padding-left:20px}
@media (max-width:640px){.cols2{columns:1}}
.cour{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.cour[aria-pressed="true"]{border-color:var(--btn);background:var(--surface2)}
.cour:disabled{opacity:.55;cursor:not-allowed}
.best{background:var(--gold);color:#241a05;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rate .chip-f{padding:5px 10px;min-height:34px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b1f1c;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;max-width:92vw;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* investors */
.inv{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
.inv section{margin-top:56px}
.inv h2{font-size:clamp(26px,4vw,36px);margin-bottom:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end;margin-top:12px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(36px,7vw,64px);font-weight:800}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
.ask{background:var(--canopy);color:#F1F5EC;border-radius:24px;padding:24px}
.ask .disp{font-size:44px;font-weight:800;line-height:1}
.ask small{color:#B9C9BF;display:block;margin-top:8px}
.ask .btn{margin-top:18px;background:var(--gold);color:#241a05}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface)}
.card h3{font-size:20px;margin-bottom:8px}
.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
.phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;padding:18px 0;border-top:1px solid var(--line)}
@media (max-width:700px){.phase{grid-template-columns:1fr}}
.phase h3{font-size:20px}
.pbar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--btn);border-radius:7px}
.phase ul{margin:6px 0 0;padding-left:20px;font-size:15px;color:var(--muted)}
.roi{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:18px}
.roi input[type=range]{padding:0;min-height:32px;accent-color:var(--btn)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.gauge{height:18px;border-radius:9px;background:var(--surface2);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--gold);transition:width .3s}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.nums{grid-template-columns:1fr}}
.nums div{background:var(--surface2);border-radius:14px;padding:12px}
.nums b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px}
.good{color:var(--ok)} .bad{color:var(--clay)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#14382A"/><path d="M9 22c0-8 5-12 14-12 0 8-4 13-12 13l-2 2" fill="none" stroke="#E3A72F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    FarmLink Ghana
  </div>
  <nav class="navtabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-demo" data-a="tab" data-tab="demo" aria-selected="true">Live demo</button>
    <button role="tab" id="t-inv" data-a="tab" data-tab="inv" aria-selected="false">For investors</button>
  </nav>
</header>
<div class="banner">This is a working prototype. Produce, farmers and payments are sample data and simulated.</div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  const who=`<label>Buying as<select data-f="buyer">${BUYERS.map(b=>`<option value="${b.id}" ${b.id===S.buyer?'selected':''}>${esc(b.name)}, ${esc(b.type)}</option>`).join('')}</select></label>`;
  const sub=`<div class="seg" style="margin-top:12px"><button data-a="bv" data-v="market" aria-pressed="${S.bv==='market'}">${T('Market')}</button><button data-a="bv" data-v="orders" aria-pressed="${S.bv==='orders'}">${T('My orders')}${mine.length?' ('+mine.length+')':''}</button></div>`;
  if(S.bv==='orders'){
    const list=[...mine].reverse().map(orderCard).join('')||`<div class="empty"><b>No orders yet</b>Open the market and tap a listing to place your first order.</div>`;
    return who+sub+list;
  }
  const chips=['All',...Object.keys(CROPS)].map(c=>`<button class="chip-f" data-a="filter" data-v="${c}" aria-pressed="${S.filter===c}">${c}</button>`).join('');
  const items=S.listings.filter(l=>S.filter==='All'||l.crop===S.filter).map(card).join('')||`<div class="empty"><b>Nothing listed</b>Try another crop.</div>`;
  return who+sub+`<p class="pilot">Sample pilot: tomatoes and maize from farms around Techiman, Bono East. As a ${esc(bu.type.toLowerCase())} in ${esc(bu.town)} your FarmLink service fee is ${feePct(bu)}%. ${loyaltyNote(bu)} Phase 0 confirms the real region and crops.</p><div class="chips">${chips}</div>`+items;
}

function trackHtml(o){
  return `<div class="track"><span>Farm</span><div class="rail"><i data-prog="${o.id}" style="width:${o.progress}%"></i><b data-dot="${o.id}" style="left:${o.progress}%">🚚</b></div><span>${esc(o.dest)}</span></div>
  <small>${o.status==='transit'?'Live position, with SMS updates if data drops':STATUS[o.status]}</small>`;
}
function qrSvg(text){
  try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return ''}
}
function confirmHtml(o){
  if(S.disputing===o.id)return disputeForm(o);
  const m=S.form['m_'+o.id]||'sms';
  const rej=S.form['rej_'+o.id]||'0';
  const opts=[['0','None, accept everything'],['0.1','About 10%'],['0.25','About 25%'],['0.5','About half']].map(([v,l])=>`<option value="${v}" ${rej===v?'selected':''}>${l}</option>`).join('');
  const tabs=`<div class="seg" style="margin:0"><button data-a="method" data-id="${o.id}" data-v="sms" aria-pressed="${m==='sms'}">${T('SMS code')}</button><button data-a="method" data-id="${o.id}" data-v="qr" aria-pressed="${m==='qr'}">${T('QR code')}</button></div>`;
  const rejField=`<label>${T('Goods you are not accepting')}<select data-f="rej_${o.id}">${opts}</select></label>`;
  let body;
  if(m==='qr'){
    body=`${rejField}<div class="qrbox" role="img" aria-label="Delivery QR code">${qrSvg('farmlink://confirm?order='+o.id+'&code='+o.code)||('<b>'+o.code+'</b>')}</div>
    <small>Show this QR code to the courier. When the courier scans it, payment is released with the choice you made above. In this demo, switch to Courier and tap the scan button.</small>`;
  }else{
    body=`<div class="sms"><small>SMS from FarmLink, ${o.arrivedAt||now()}</small>Your delivery code is <b>${o.code}</b>. Share it only after the goods arrive and you have checked them.</div>
    <label>${T('Delivery code')}<input inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 digits" data-f="code_${o.id}" value="${esc(S.form['code_'+o.id]||'')}"></label>
    ${rejField}
    <button class="btn gold" data-a="confirm" data-id="${o.id}">${T('Confirm delivery and release payment')}</button>`;
  }
  return `<div class="confirm">${tabs}${body}<button class="link2" data-a="dispute" data-id="${o.id}">${T('Report a problem instead')}</button></div>`;
}
function disputeForm(o){
  const f=S.form;
  const reasons=['Goods damaged or spoiled','Wrong crop delivered','Quantity is short','Quality is poor','Something else'];
  const opts=['<option value="">Choose a reason</option>',...reasons.map(r=>`<option ${f['dr_'+o.id]===r?'selected':''}>${r}</option>`)].join('');
  const want=f['dw_'+o.id]||'partial';
  return `<div class="confirm"><b>${T('Report a problem')}</b>
    <small>Your payment stays in escrow while FarmLink reviews. The plan sets a 24 to 48 hour dispute window.</small>
    <label>What went wrong<select data-f="dr_${o.id}">${opts}</select></label>
    <label>What would fix it<select data-f="dw_${o.id}"><option value="partial" ${want==='partial'?'selected':''}>A partial refund</option><option value="full" ${want==='full'?'selected':''}>A full refund</option></select></label>
    <button class="btn ghost" data-a="photo" data-id="${o.id}">${f['dp_'+o.id]?'📷 Photos attached. Tap to remove':'📷 Attach photo evidence'}</button>
    <button class="btn primary" data-a="submitDispute" data-id="${o.id}">Send to the dispute desk</button>
    <button class="btn ghost" data-a="cancelDispute">Back</button></div>`;
}
function receiptHtml(o){
  const rate=o.rated?`<small style="display:block;margin-top:8px">You rated ${esc(o.courierName)} ${o.rated} out of 5.</small>`:`<div class="rate"><small>Rate ${esc(o.courierName)}:</small>${[1,2,3,4,5].map(v=>`<button class="chip-f" data-a="rate" data-id="${o.id}" data-v="${v}">${v}★</button>`).join('')}</div>`;
  return `<div class="rows">
    <div><span>Farmer receives</span><b>${money(o.farmerPay,2)}</b></div>
    <div><span>Courier receives</span><b>${money(o.courierPay,2)}</b></div>
    <div><span>FarmLink fees</span><b>${money(o.platformPay,2)}</b></div>
    <div><span>Refunded to you</span><b>${money(o.refund,2)}</b></div></div>
    <small>${o.resolution?'Dispute resolved: '+esc(o.resolution)+'. ':''}${o.farmerPay>0?'Farmer paid to '+esc(o.net)+' the moment payment was released.':''}</small>${rate}`;
}
function orderCard(o){
  let extra=`<small style="display:block;margin-top:8px">Courier: ${esc(o.courierName)}, ${esc(o.vehicle)}, ${o.pickupKm} km from the farm</small>`;
  if(['assigned','picked','transit'].includes(o.status))extra+=trackHtml(o);
  if(o.status==='arrived')extra+=confirmHtml(o);
  if(o.status==='disputed')extra+=`<small style="display:block;margin-top:10px">Reported: ${esc(o.dispute.reason)}. Your ${money(o.paid,2)} stays in escrow until the dispute desk decides.</small>`;
  if(o.status==='released')extra+=receiptHtml(o);
  return `<article class="ord"><header><span class="ico sm">${o.emoji}</span><div><b>${o.qty} ${plural(o.unit,o.qty)} of ${esc(o.crop)}</b><small>${esc(o.farmer)}, ${money(o.paid,2)} paid</small></div><span class="chip s-${o.status}">${T(STATUS[o.status])}</span></header>${extra}</article>`;
}

      ${['assigned','picked','transit','arrived'].includes(o.status)?trackHtml(o):''}

}

      <span class="price">${money(r.fee)}<small>delivery</small></span></button>`).join('');

/* ---------- side panel ---------- */
function hintFor(last){
  if(!last)return ['As the buyer, tap the tomatoes from Techiman and place an order.','buyer','Go to Buyer'];
  return {
    escrow:[`The money is held in escrow and the job went to ${last.courierName}. Switch to Courier and accept it.`,'courier','Go to Courier'],
    assigned:['As the courier, confirm pickup at the farm.','courier','Go to Courier'],
    picked:['Start the trip to see live tracking.','courier','Go to Courier'],
    transit:['The truck is on the road. Watch it move, then switch to Buyer.','buyer','Go to Buyer'],
    arrived:['The goods have arrived. As the buyer, confirm with the SMS code or the QR code, or report a problem.','buyer','Go to Buyer'],
    disputed:['A dispute is open and the money is frozen. Decide it in the Dispute desk below to see how escrow settles.',null,''],
    released:['Payment released. Open the Farmer view to see the payout, or place another order.','farmer','Go to Farmer']
  }[last.status];
}
function panel(){
  const L=S.ledger, total=L.escrow+L.farmers+L.couriers+L.platform+L.refunds;
  const segs=[['Held in escrow',L.escrow,'#E3A72F'],['Paid to farmers',L.farmers,'#6FCB98'],['Paid to couriers',L.couriers,'#86B6F0'],['FarmLink revenue',L.platform,'#F08A66'],['Refunded to buyers',L.refunds,'#B8C2BB']];
  const bar=total?segs.filter(s=>s[1]>0).map(s=>`<i style="flex:${s[1]};background:${s[2]}"></i>`).join(''):'';
  const legend=segs.map(s=>`<div><span class="sw" style="background:${s[2]}"></span>${T(s[0])}<b>${money(s[1])}</b></div>`).join('');
  const last=S.orders[S.orders.length-1];
  const done=last?DONE[last.status]:0;
  const steps=STEPS.map((t,i)=>{const c=i<done?'done':(i===done&&done<6&&last?'now':'');const label=(i===4&&last&&last.status==='disputed')?'Dispute under review':t;return `<li class="${c}"><span class="c">${i<done?'✓':i+1}</span>${label}</li>`}).join('');
  const h=hintFor(last);
  const logs=S.log.slice(0,6).map(e=>`<div><time>${e.t}</time><span>${esc(e.text)}</span></div>`).join('')||'<small>Events appear here as the order moves.</small>';
  const dis=S.orders.filter(o=>o.status==='disputed');
  const desk=dis.length?`<div><h2 style="font-size:22px">Dispute desk</h2>${dis.map(o=>`<div class="case"><b>Order #${o.id}: ${esc(o.crop)} from ${esc(o.farmer)}</b><small>Buyer says: ${esc(o.dispute.reason)}. Wants ${o.dispute.want==='full'?'a full refund':'a partial refund'}. ${o.dispute.photos?'Photos attached. ':''}${money(o.paid,2)} is frozen in escrow.</small><div class="acts"><button class="btn" data-a="resolve" data-id="${o.id}" data-v="1">Refund buyer in full</button><button class="btn" data-a="resolve" data-id="${o.id}" data-v="0.5">Split 50/50</button><button class="btn" data-a="resolve" data-id="${o.id}" data-v="0">Pay the farmer in full</button></div></div>`).join('')}</div>`:'';
  const rate=S.orders.length?Math.round(L.disputes/S.orders.length*100):0;
  return `<div><h2>${T('Where the money is, right now')}</h2><small>What the platform sees across all buyers, farmers and couriers. In production, a licensed payment partner holds the escrow funds.</small>
    <div class="mbar" role="img" aria-label="Split of money handled">${bar}</div><div class="legend">${legend}</div></div>
  <div class="stats"><div><small>${T('Orders completed')}</small><b>${L.done}</b></div><div><small>Order value delivered</small><b>${money(L.gmv)}</b></div><div><small>Dispute rate (goal: under 5%)</small><b>${rate}%</b></div></div>
  <div><h2 style="font-size:22px">${T('Follow one order')}</h2>
    <ol class="steps">${steps}</ol>
    <div class="hint"><span>${h[0]}</span>${h[1]?`<button class="btn" data-a="role" data-role="${h[1]}" data-buyer="${last?last.buyerId:''}" data-courier="${last?last.courierId:''}" data-farmer="${last?esc(last.fid):''}">${h[2]} view</button>`:''}</div></div>
  ${desk}
  <div><h2 style="font-size:22px">${T('Activity')}</h2><div class="log">${logs}</div></div>
  <div style="display:grid;gap:4px"><button class="link" data-a="tab" data-tab="inv">Read the investor summary</button><button class="link" data-a="reset">${T('Reset the demo')}</button></div>`;
}

const PHASES=[
  ['Phase 0: Validate and set up','Months 1 to 2',7700,'about GH¢88,500',['3+ aggregators committed to buy','50+ farmers interested','A payment partner agreed in principle']],
  ['Phase 1: MVP and pilot','Months 3 to 8',53400,'about GH¢614,000',['200+ verified farmers and 30+ buyers','300+ completed orders','Fewer than 5% of orders disputed','Farmers paid within 24 hours of delivery']],

function roiNums(){
  const g=S.roi.gmv,c=S.roi.com/100,rev=g*(c+.005),cost=16000;
  return {rev,cost,net:rev-cost,be:cost/(c+.005),cover:Math.min(100,rev/cost*100)};
}

  const n=roiNums();

    <div class="card"><h3>With FarmLink</h3><ul><li>Payment is protected in escrow through a licensed payment partner.</li><li>Verified farms, GPS-pinned locations and ratings build trust.</li><li>Couriers are matched to every order and deliveries are tracked.</li><li>An offline-first Android app, English, Twi and Ga with voice support, and field agents for farmers with limited digital literacy.</li></ul></div></div></section>

    <div style="margin-top:12px">${phases}</div></section>

  <section><h2>How I plan to make money</h2>

    <div class="roi" style="margin-top:18px"><h3 class="disp" style="font-size:22px">Test the break-even yourself</h3>
      <small>My plan puts Phase 2 spending at about US$16,000 a month. This simple model counts commission plus about 0.5% of order value from delivery margin, and leaves subscriptions out, so the plan's own break-even of roughly US$300,000 to 400,000 a month is the figure to quote.</small>
      <div class="presets"><button class="chip-f" data-a="preset" data-g="15000">End of Phase 1</button><button class="chip-f" data-a="preset" data-g="150000">End of Phase 2</button><button class="chip-f" data-a="preset" data-g="1000000">Month 36</button></div>
      <label>Monthly order value: <span id="o-g">${usd(S.roi.gmv)}</span><input type="range" min="5000" max="1000000" step="5000" value="${S.roi.gmv}" data-roi="gmv"></label>
      <label>Commission rate: <span id="o-c">${S.roi.com}%</span><input type="range" min="3" max="7" step="0.5" value="${S.roi.com}" data-roi="com"></label>
      <div class="gauge"><i id="o-gauge" style="width:${n.cover}%"></i></div>
      <div class="nums"><div><small>Monthly revenue</small><b id="o-rev">${usd(n.rev)}</b></div><div><small>Against US$16,000 spend</small><b id="o-net" class="${n.net>=0?'good':'bad'}">${n.net>=0?'+':'−'}${usd(Math.abs(n.net))}</b></div><div><small>Break-even order value</small><b id="o-be">${usd(n.be)}</b></div></div></div></section>

  <section><h2>What I will measure</h2><div class="card"><ul class="cols2">${kpis}</ul></div></section>

  <section><h2>Technology foundation</h2><div class="card"><p>Flutter or React Native for mobile, React or Next.js for web, and Node.js or Python with PostgreSQL for the backend. Licensed payment APIs, SMS and WhatsApp notifications, maps with an offline fallback, cloud media storage, and security controls including encryption, role-based access and audit logs.</p></div></section>

  <section><h2>Risks I am aware of</h2><div class="card"><table>${risks}</table></div></section>

  <section><h2>What you have just seen, and what funding builds</h2><p style="color:var(--muted);max-width:62ch;margin-bottom:14px">The demo shows one sample pilot, tomatoes and maize from around Techiman in Bono East. Phase 0 confirms the real region and crops with the first aggregators.</p><div class="cols">
    <div class="card"><h3>Working in this prototype</h3><ul><li>Role-based flows for buyer, farmer and courier</li><li>Four buyer types (aggregator, trader, caterer, household) with different service fees and delivery towns, so courier options change with the trip</li><li>Buyers choose a courier by rating, distance to the farm, fee and vehicle size, with a best-match suggestion, and rate the courier after delivery</li><li>Listings, ordering and a fee breakdown</li><li>Escrow ledger with partial release for rejected goods</li><li>Courier job flow, live tracking, and delivery confirmation by SMS code or QR code</li><li>Dispute desk: escrow freezes, then refunds, splits or pays the farmer</li><li>English and Twi switch in the app (first draft)</li></ul></div>
    <div class="card"><h3>Simulated today, built in the funded phases</h3><ul><li>Real mobile money through a licensed payment partner</li><li>SMS and WhatsApp OTP, Ghana Card verification, GPS farm pinning</li><li>Photo and video upload, and real voice notes</li><li>Real GPS tracking and offline-first mobile apps</li><li>Full Twi and Ga support, USSD and SMS ordering</li><li>A market price board</li><li>Security audit and Data Protection registration</li></ul></div></div></section>

  <section style="text-align:center"><h2>Fund the pilot, then judge it on real orders</h2>
    <p style="color:var(--muted);max-width:58ch;margin:0 auto 18px">Phases 0 and 1, about US$61,000, end with 300+ real orders and a measured dispute rate, so every later dollar rests on evidence.</p>

/* ---------- render + events ---------- */
function render(){
  const body=document.querySelector('.app-body'); const st=body?body.scrollTop:0;
  $('#app').innerHTML=S.tab==='demo'?demoView():investorView();
  const b2=document.querySelector('.app-body'); if(b2)b2.scrollTop=st;
  $('#t-demo').setAttribute('aria-selected',S.tab==='demo');
  $('#t-inv').setAttribute('aria-selected',S.tab==='inv');
}
function updateRoi(){
  const n=roiNums(); const set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v};
  set('o-g',usd(S.roi.gmv));set('o-c',S.roi.com+'%');set('o-rev',usd(n.rev));set('o-be',usd(n.be));
  const net=$('#o-net'); if(net){net.textContent=(n.net>=0?'+':'−')+usd(Math.abs(n.net));net.className=n.net>=0?'good':'bad'}
  const g=$('#o-gauge'); if(g)g.style.width=n.cover+'%';
}
function release(o,rf){
  const a=1-rf;
  o.refund=r2(o.produce*rf*(1+o.feeRate));
  o.farmerPay=r2(o.produce*a-o.sellerFee*a);
  o.courierPay=r2(o.delivery*.9);
  o.platformPay=r2(o.paid-o.refund-o.farmerPay-o.courierPay);
  const L=S.ledger; L.escrow=r2(L.escrow-o.paid); L.farmers=r2(L.farmers+o.farmerPay); L.couriers=r2(L.couriers+o.courierPay);
  L.platform=r2(L.platform+o.platformPay); L.refunds=r2(L.refunds+o.refund); L.gmv=r2(L.gmv+o.produce*a); L.done++;
  o.status='released';
  const cr=S.couriers.find(x=>x.id===o.courierId);if(cr)cr.trips++;
  log(o.farmerPay>0?`Order #${o.id} settled. ${o.farmer} paid ${money(o.farmerPay,2)} to ${o.net}.`:`Order #${o.id} settled with a full refund to the buyer.`);
}
function act(a,d){
  const oid=+d.id; const o=S.orders.find(x=>x.id===oid);
  switch(a){
    case 'tab':S.tab=d.tab;render();window.scrollTo(0,0);return;
    case 'role':S.role=d.role;S.tab='demo';if(d.buyer)S.buyer=+d.buyer;if(d.courier)S.courier=+d.courier;if(d.farmer)S.farmer=d.farmer;render();return;
    case 'bv':S.bv=d.v;render();return;
    case 'filter':S.filter=d.v;render();return;
    case 'open':S.sheet={step:'qty',lid:+d.id,qty:1,net:NETS[0],sort:'match',courierId:null};render();return;
    case 'closeSheet':S.sheet=null;render();return;
    case 'qdown':S.sheet.qty=Math.max(1,S.sheet.qty-1);S.sheet.courierId=null;render();return;
    case 'qup':{const l=S.listings.find(x=>x.id===S.sheet.lid);S.sheet.qty=Math.min(l.qty,S.sheet.qty+1);S.sheet.courierId=null;render();return}
    case 'toCourier':S.sheet.step='courier';render();return;
    case 'backQty':S.sheet.step='qty';S.sheet.courierId=null;render();return;
    case 'sort':S.sheet.sort=d.v;render();return;
    case 'pickCourier':S.sheet.courierId=+d.id;render();return;
    case 'toPay':if(!S.sheet.courierId){toast('Choose a courier to continue.');return}S.sheet.step='pay';render();return;
    case 'rate':{
      const cr=S.couriers.find(x=>x.id===o.courierId),v=+d.v;o.rated=v;
      if(cr&&cr.trips>0)cr.rating=Math.round(((cr.rating*(cr.trips-1)+v)/cr.trips)*10)/10;
      render();toast('Thanks. You rated '+o.courierName+' '+v+' out of 5.');return}
    case 'net':S.sheet.net=d.v;render();return;
    case 'pay':
      if(String(S.form.phone||'').replace(/\D/g,'').length<9){toast('Enter a valid mobile money number.');return}
      S.sheet.step='approve';S.form.pin='';render();return;
    case 'approve':{
      if(String(S.form.pin||'').length!==4){toast('Enter a 4 digit PIN to approve.');return}
      const sh=S.sheet,l=S.listings.find(x=>x.id===sh.lid),c=S.couriers.find(x=>x.id===sh.courierId),b=orderMath(l,sh.qty,c);
      l.qty-=sh.qty;
      const no={id:S.nextId++,lid:l.id,crop:l.crop,emoji:l.emoji,farmer:l.farmer,fid:l.farmer,farm:l.farm,region:l.region,unit:l.unit,qty:sh.qty,price:l.price,km:l.km,trip:tripFor(l),dest:curBuyer().town,buyerId:S.buyer,buyerName:curBuyer().name,feeRate:feeFor(curBuyer()),...b,courierId:c.id,courierName:c.name,vehicle:c.vehicle,pickupKm:pickupKm(c,l),net:sh.net,code:String(1000+Math.floor(Math.random()*9000)),status:'escrow',progress:0};
      S.orders.push(no);S.ledger.escrow=r2(S.ledger.escrow+b.paid);S.courier=c.id;
      log(`Order #${no.id}: ${money(b.paid,2)} received from ${no.buyerName} via ${sh.net} and held in escrow.`);
      log(`Delivery job sent to ${c.name} (${c.vehicle}, ${no.pickupKm} km from the farm).`);
      S.sheet=null;S.role='buyer';S.bv='orders';render();toast(T('Payment received. Your money is held in escrow.'));return}
    case 'accept':o.status='assigned';log(`${o.courierName} accepted order #${o.id}.`);render();return;
    case 'pickup':o.status='picked';log(`Order #${o.id} loaded at ${o.farm}. Buyer notified by SMS.`);render();return;
    case 'start':o.status='transit';o.progress=2;log(`Order #${o.id} left ${o.region}. Live tracking started.`);render();return;
    case 'confirm':{
      const code=String(S.form['code_'+o.id]||'').trim();
      if(code!==o.code){toast('That code does not match. Check the SMS and try again.');return}
      release(o,parseFloat(S.form['rej_'+o.id]||'0'));
      delete S.form['code_'+o.id];render();toast(T('Delivery confirmed. The farmer has been paid.'));return}
    case 'lang':S.lang=d.v;render();return;
    case 'method':S.form['m_'+oid]=d.v;render();return;
    case 'scan':
      log(`Courier scanned the buyer's QR code for order #${o.id}.`);
      release(o,parseFloat(S.form['rej_'+o.id]||'0'));render();toast('QR code scanned. Delivery confirmed and payment released.');return;
    case 'dispute':S.disputing=oid;render();return;
    case 'cancelDispute':S.disputing=null;render();return;
    case 'photo':S.form['dp_'+oid]=!S.form['dp_'+oid];render();return;
    case 'submitDispute':{
      const reason=S.form['dr_'+oid];
      if(!reason){toast('Choose what went wrong before sending.');return}
      o.status='disputed';o.dispute={reason,want:S.form['dw_'+oid]||'partial',photos:!!S.form['dp_'+oid]};
      S.ledger.disputes++;S.disputing=null;
      log(`Buyer reported a problem on order #${o.id}: ${reason}. Escrow is frozen until the dispute desk decides.`);
      render();toast('Problem reported. Your money stays in escrow while we review.');return}
    case 'resolve':{
      o.resolution={'1':'full refund to the buyer','0.5':'split 50/50 between buyer and farmer','0':'paid to the farmer in full'}[d.v];
      release(o,parseFloat(d.v));render();toast('Dispute resolved. Escrow has been settled.');return}
    case 'voice':S.voice=!S.voice;render();return;
    case 'addListing':{
      const q=+S.form.lqty,p=+S.form.lprice;
      if(!(q>0&&p>0)){toast('Enter a quantity and a price above zero.');return}
      const crop=S.form.lcrop||'Tomatoes',base=S.listings.find(x=>x.farmer===S.farmer);
      S.listings.unshift({id:S.nextLid++,crop,emoji:CROPS[crop],farmer:S.farmer,farm:base.farm,region:base.region,qty:Math.floor(q),unit:UNITS[crop],price:p,harvest:'Harvested today',km:base.km,verified:base.verified,rating:base.rating,voice:S.voice});
      log(`${S.farmer} listed ${Math.floor(q)} ${plural(UNITS[crop],Math.floor(q))} of ${crop} at ${money(p)}.`);
      S.form.lqty='';S.form.lprice='';S.voice=false;render();toast('Listing published. Buyers can see it now.');return}
    case 'preset':S.roi.gmv=+d.g;render();return;
    case 'reset':{const lg=S.lang;S=init();S.lang=lg;render();window.scrollTo(0,0);return}
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return;
  if(b.dataset.bg&&e.target!==b)return; // only backdrop clicks close the sheet
  act(b.dataset.a,b.dataset);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.roi){S.roi[t.dataset.roi]=parseFloat(t.value);updateRoi();return}
  if(t.dataset.f){S.form[t.dataset.f]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f==='farmer'){S.farmer=t.value;render()}
  if(t.dataset.f==='lcrop'){S.form.lcrop=t.value;render()}
  if(t.dataset.f==='courier'){S.courier=+t.value;render()}
  if(t.dataset.f==='buyer'){S.buyer=+t.value;S.sheet=null;render()}
});
setInterval(()=>{
  let changed=false;
  S.orders.forEach(o=>{
    if(o.status!=='transit')return;
    o.progress=Math.min(100,o.progress+5);
    document.querySelectorAll(`[data-prog="${o.id}"]`).forEach(el=>el.style.width=o.progress+'%');
    document.querySelectorAll(`[data-dot="${o.id}"]`).forEach(el=>el.style.left=o.progress+'%');
    if(o.progress>=100){o.status='arrived';o.arrivedAt=now();log(`Delivery reached ${o.dest}. Code sent by SMS to ${o.buyerName} for order #${o.id}.`);changed=true}
  });
  if(changed)render();
},450);
render();
</script>
